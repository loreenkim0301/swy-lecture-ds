<!--
  swy-lecture-ds 시작 파일

  코드를 몰라도 됩니다. 이 파일을 저장한 뒤, 아래 두 가지만 하면 됩니다.
  1) 파일을 더블클릭하면 브라우저에 바로 결과물이 보입니다.
  2) 메모장(윈도우) / 텍스트 편집기(맥)로 이 파일을 열어서,
     "여기 제목을 바꾸세요", "여기 내용을 바꾸세요" 라고 써진 글자만
     원하는 내용으로 바꾸고 저장하면 됩니다. <div>, class 같은 글자는
     건드리지 않아도 됩니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여기 페이지 제목을 바꾸세요</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">

<!-- 디자인 시스템 CDN — 이 두 줄은 지우지 마세요 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/loreenkim0301/swy-lecture-ds@main/dist/swy-lecture-ds.min.css">
<script src="https://cdn.jsdelivr.net/gh/loreenkim0301/swy-lecture-ds@main/dist/sw-ds.js" defer></script>
</head>
<body>

<div class="sw-scope" style="max-width:820px; margin:0 auto; padding:56px 24px 96px;">

  <header class="sw-doc-header">
    <div class="sw-date">2026.09.02</div>
    <h1>여기 제목을 바꾸세요</h1>
    <p class="sw-lede">여기 한두 문장으로 이 페이지가 무엇에 관한 것인지 설명하세요.</p>
  </header>

  <div class="sw-card">
    <h3>여기 카드 제목을 바꾸세요</h3>
    <p>여기 카드 안에 들어갈 설명 문장을 바꾸세요. 이 박스는 <code>.sw-card</code> 클래스가 만듭니다.</p>
  </div>

  <div class="sw-tip">
    <span class="sw-label">팁</span>
    이렇게 생긴 초록색 박스는 팁을 강조할 때 씁니다. 글자만 바꿔서 쓰세요.
  </div>

  <div class="sw-note">
    <span class="sw-label">참고</span>
    이렇게 생긴 파란색 박스는 참고 정보를 적을 때 씁니다.
  </div>

  <footer class="sw-page-footer">
    swy-lecture-ds로 만들었습니다 · <a href="https://github.com/loreenkim0301/swy-lecture-ds" target="_blank" rel="noopener">GitHub</a>
  </footer>

</div>
</body>
</html>
